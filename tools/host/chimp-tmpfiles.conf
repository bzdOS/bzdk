# Directory for the board's cross-process locks (loady_over_acm.py).
# Install: cp tools/host/chimp-tmpfiles.conf /etc/tmpfiles.d/chimp.conf
#          systemd-tmpfiles --create chimp.conf
# Group fleet may create and open locks; setgid keeps files in that group.
# Not sticky on purpose: fs.protected_regular only applies to sticky dirs.
d /run/chimp 2775 root fleet -

# Target of the 2026-10 subnet move (tools/subnet/cutover.py apply this-file).
# The host stays in 192.168.88.0/24 and reaches 192.0.2.0/24 via the router.
# Addresses by DHCP (the MikroTik's server on 192.0.2.0/24): the HV takes a
# lease with its own MAC (dbgip.h, U-Boot bzdk_net=dhcp), the guest runs
# dhclient; the host learns both (board_ip/guest_ip = auto, bzd_board.py).
# uboot_ip is U-Boot's own static ipaddr (its TFTP fallback, netconsole) and
# the HV's address when no lease came within 10 s -- keep it outside the
# DHCP pool. server_ip (this host) is the one fixed address the board needs.
transport = udp
net       = dhcp
iface     = br0
tap       = bzd0
board_ip  = auto
uboot_ip  = 192.0.2.7
dbg_port  = 34997
guest_ip  = auto
server_ip = 192.168.88.2
gateway   = 192.0.2.1
netmask   = 255.255.255.0
dns       = 192.0.2.1

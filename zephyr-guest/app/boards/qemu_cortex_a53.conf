# QEMU-only overlay used SOLELY to sanity-check app/src/main.c's *logic*
# (tickless busy-wait heartbeat loop, no k_sleep) on a real, runnable QEMU
# target -- qemu_cortex_a53 has entirely different MMIO addresses (GICv3,
# PL011) than the real bpi_m64_hv board and is NOT a stand-in for it. See
# docs/zephyr-guest.md for why a literal QEMU boot of the bpi_m64_hv build
# itself is not a meaningful test (no QEMU machine matches that MMIO map).
CONFIG_ARM_ARCH_TIMER=n
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_BUSYWAIT_CPU_LOOPS_PER_USEC=400

# QEMU-only overlay to sanity-check app/src/main.c's *logic* (tickless
# busy-wait heartbeat loop, no k_sleep) standing entirely alone, with no
# hypervisor underneath: qemu_cortex_a53 has entirely different MMIO
# addresses (GICv3, PL011) than the real bpi_m64_hv board and is NOT a
# stand-in for it.
#
# CORRECTION, 2026-08-04: this comment used to say that a QEMU boot of the
# bpi_m64_hv build itself could not be meaningful, because no QEMU machine
# matches its MMIO map. That reasoning was wrong -- it assumed the guest's
# MMIO has to be answered by QEMU. It doesn't: UART0 is trap-emulated by the
# hypervisor and never reaches QEMU at all. The real bpi_m64_hv image boots
# unmodified under `make zephyr-qemu`; run ../../../zephyr-qemu-ci.sh and see
# ../../../docs/zephyr-guest.md. That is the stronger test, and this overlay
# is now only useful for testing the app in isolation from the hypervisor.
CONFIG_ARM_ARCH_TIMER=n
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_BUSYWAIT_CPU_LOOPS_PER_USEC=400
